<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>访问验证 · 晋级赛复习台</title>
<style>
:root{color-scheme:light;font:16px/1.65 "PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Droid Sans Fallback",system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;color:#2d2923;background:#f3eee4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(100%,410px);padding:clamp(20px,6vw,32px);border:1px solid #d9ded2;border-radius:14px;background:#fffefa;box-shadow:0 2px 5px #313c2510}
h1{font:700 1.5rem/1.3 "Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC",SimSun,serif;margin:0 0 8px}
p{margin:0 0 18px;color:#505f55}
label{display:block;font-weight:700;margin-bottom:5px}
input,button{width:100%;min-height:46px;font:inherit;border-radius:8px}
input{padding:8px 10px;border:1px solid #818e80;background:#fffefa;color:#25352d}
button{margin-top:12px;border:1px solid #903a2c;background:#903a2c;color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.65;cursor:default}
:focus-visible{outline:3px solid #86551d;outline-offset:2px}
#feedback{color:#913b31;margin:10px 0 0}
#feedback:empty{margin:0}
#download{margin-top:14px;color:#505f55;font-size:.875rem;font-variant-numeric:tabular-nums}
.download-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
#download-speed{white-space:nowrap}
#download-progress{display:block;width:100%;height:9px;margin-top:5px;accent-color:#903a2c}
</style>
</head>
<body>
<main>
  <h1>A–D 晋级赛复习台</h1>
  <p>请输入访问密码。</p>
  <form id="unlock" method="post">
    <label for="password">访问密码</label>
    <input id="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
    <button type="submit" disabled>进入复习台</button>
    <div id="download" hidden>
      <div class="download-line"><span id="download-state"></span><span id="download-speed"></span></div>
      <progress id="download-progress" aria-label="题库下载进度" max="100" value="0"></progress>
    </div>
    <p id="feedback" role="status"></p>
  </form>
  <noscript>请启用 JavaScript 以解锁页面。</noscript>
</main>
<script>
const form = document.getElementById("unlock");
const input = document.getElementById("password");
const feedback = document.getElementById("feedback");
const button = form.querySelector("button");
const download = document.getElementById("download");
const progress = document.getElementById("download-progress");
const downloadState = document.getElementById("download-state");
const downloadSpeed = document.getElementById("download-speed");
const lengthSize = 4, saltSize = 16, ivSize = 12;
const headerSize = lengthSize + saltSize + ivSize;
let bankDownload;

function speedLabel(bytes, milliseconds) {
  return (bytes / Math.max(1, milliseconds) / 1000).toFixed(2) + " MB/s";
}

async function readBank() {
  const length = new Uint8Array(lengthSize);
  const chunks = [];
  let received = 0, total = 0, sampled = 0;
  const started = performance.now();
  let sampledAt = started;
  const timer = setInterval(() => {
    const now = performance.now();
    downloadSpeed.textContent = speedLabel(received - sampled, now - sampledAt);
    sampled = received;
    sampledAt = now;
  }, 500);
  try {
    const response = await fetch("./bank.bin", {cache:"no-cache"});
    if (!response.ok || !response.body) throw new Error("题库响应不可用");
    const reader = response.body.getReader();
    try {
      while (true) {
        const {value, done} = await reader.read();
        if (done) break;
        if (received < lengthSize) {
          length.set(value.subarray(0, lengthSize - received), received);
          if (received + value.length >= lengthSize) {
            total = new DataView(length.buffer).getUint32(0);
            if (total <= headerSize + 16) throw new Error("题库长度无效");
          }
        }
        received += value.length;
        if (total && received > total) throw new Error("题库超出声明长度");
        chunks.push(value);
        if (total) {
          progress.value = received / total * 100;
          downloadState.textContent = "正在载入题库 · " + Math.floor(progress.value) + "%";
        }
      }
    } finally {
      reader.releaseLock();
    }
    if (!total || received !== total) throw new Error("题库下载不完整");
    const bytes = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) {
      bytes.set(chunk, offset);
      offset += chunk.length;
    }
    downloadState.textContent = "题库已载入 · 100%";
    downloadSpeed.textContent = speedLabel(received, performance.now() - started);
    return bytes;
  } finally {
    clearInterval(timer);
  }
}

function startBankDownload() {
  download.hidden = false;
  progress.value = 0;
  downloadState.textContent = "正在载入题库 · 0%";
  downloadSpeed.textContent = "0.00 MB/s";
  const request = readBank();
  bankDownload = request;
  request.catch(() => {
    bankDownload = undefined;
    downloadState.textContent = "题库下载失败";
    downloadSpeed.textContent = "0.00 MB/s";
  });
  return request;
}

function unlockFailed(message) {
  feedback.textContent = message;
  button.disabled = false;
  button.textContent = "进入复习台";
  input.focus();
}

if (window.crypto.subtle) {
  form.onsubmit = async event => {
    event.preventDefault();
    if (button.disabled) return;
    button.disabled = true;
    button.textContent = "正在载入题库…";
    feedback.textContent = "";
    const password = input.value;
    input.value = "";
    let bank;
    try {
      bank = await (bankDownload ?? startBankDownload());
    } catch {
      unlockFailed("题库下载失败，请检查网络后重试。");
      return;
    }
    button.textContent = "正在解锁…";
    const salt = bank.subarray(lengthSize, lengthSize + saltSize);
    const iv = bank.subarray(lengthSize + saltSize, headerSize);
    let html;
    try {
      const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},
        material, {name:"AES-GCM",length:256}, false, ["decrypt"]);
      const plaintext = await crypto.subtle.decrypt({name:"AES-GCM",iv}, key, bank.subarray(headerSize));
      html = new TextDecoder().decode(plaintext);
    } catch (error) {
      unlockFailed(error.name === "OperationError" ? "密码不正确，请再试一次。" : "浏览器无法解锁页面，请重试。");
      return;
    }
    document.open();
    document.write(html);
    document.close();
  };
  button.disabled = false;
  startBankDownload();
} else {
  feedback.textContent = "此浏览器环境无法解锁，请通过 HTTPS 在新版浏览器中打开。";
}
</script>
</body>
</html>
