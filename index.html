      button.disabled = false;
      button.textContent = "进入复习台";
      input.focus();
      return;
    }
    document.open();
    document.write(html);
    document.close();
  };
} else {
  feedback.textContent = "此浏览器环境无法解锁，请通过 HTTPS 在新版浏览器中打开。";
}
</script>
</body>
</html>
