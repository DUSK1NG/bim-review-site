const form = document.getElementById("unlock");
const input = document.getElementById("password");
const feedback = document.getElementById("feedback");
const button = form.querySelector("button");
if (window.crypto.subtle) {
  button.disabled = false;
  form.onsubmit = async event => {
    event.preventDefault();
    if (button.disabled) return;
    button.disabled = true;
    button.textContent = "正在解锁…";
    feedback.textContent = "";
    const password = input.value;
    input.value = "";
    let html;
    try {
      const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},
        material, {name:"AES-GCM",length:256}, false, ["decrypt"]);
      const plaintext = await crypto.subtle.decrypt({name:"AES-GCM",iv}, key, decode(payload));
      html = new TextDecoder().decode(plaintext);
    } catch (error) {
      feedback.textContent = error.name === "OperationError" ? "密码不正确，请再试一次。" : "浏览器无法解锁页面，请重试。";
      button.disabled = false;
      button.textContent = "进入复习台";
      input.focus();
      return;
    }
    document.open();
    document.write(html);
    document.close();
  };
} else {
  feedback.textContent = "此浏览器环境无法解锁，请通过 HTTPS 在新版浏览器中打开。";
}
